name: Android APK

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ['android/**']

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: npm ci
      - name: Original engine and bundle tests
        run: npm test
      - name: Package complete offline editor
        run: npm run build:android -- --no-build
      - name: Offline package and fidelity checks
        run: npm run check:android
      - name: Compile APK, lint and Android tests
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug :app:testDebugUnitTest
      - name: Prepare installable APK
        run: |
          mkdir -p android-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk android-artifacts/Image-to-Pixel-1.0.0-debug.apk
          cp android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk android-artifacts/Image-to-Pixel-tests.apk
          sha256sum android-artifacts/Image-to-Pixel-1.0.0-debug.apk | tee android-artifacts/SHA256SUMS.txt
          printf '### Image-to-Pixel\n\nAPK compatible with ARM64, Android 10+. Download **Image-to-Pixel-APK** below.\n\n' >> "$GITHUB_STEP_SUMMARY"
          cat android-artifacts/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: Image-to-Pixel-APK
          path: android-artifacts/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-build-reports
          path: |
            android/app/build/reports/
            android/app/build/outputs/logs/

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build:android
      - run: npx playwright install --with-deps chromium
      - name: Original UI, Android UI and pixel parity
        run: npm run test:android-web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-web-comparison
          path: _android-test/

  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/download-artifact@v4
        with: { name: Image-to-Pixel-APK, path: android-artifacts }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run real WebView offline tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: bash scripts/test-android-device.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-device-tests
          path: _android-test/
